name: Jekyll Render Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check rendered output
        run: |
          echo "--- generated html pages ---"
          find _site -name "*.html" | sort
          echo "--- homepage key facts ---"
          for s in "Junteng Liu" "HKUST NLP Group" "Shanghai Jiao Tong University" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "SynLogic" "C-Eval" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710"; do if grep -q "$s" _site/index.html; then echo "FOUND: $s"; else echo "MISSING: $s"; fi; done
          echo "--- publications page ---"
          ls -la _site/publications
          for s in "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient Modules"; do if grep -q "$s" _site/publications/index.html; then echo "FOUND: $s"; else echo "MISSING: $s"; fi; done
